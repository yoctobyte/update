    - "The repo may be actively running for crawlers and public traffic."
    - "Do not use run.sh casually from dev."
    - "Prefer read-only inspection unless the task needs code changes."
  git:
    - "Do not sweep unrelated untracked files into commits."
    - "Treat existing untracked areas as intentional unless told otherwise."
  product:
    - "Avoid shaping primary navigation around query parameters like '/?topic=...'."
    - "Keep lane URLs stable while experiments continue."

