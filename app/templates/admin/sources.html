{% extends "admin/base_admin.html" %}
{% block title %}Bronnen{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Bronnen</h1>
  <a href="{{ url_for('admin.source_new') }}" class="btn">+ Nieuwe bron</a>
</div>

<table class="data-table">
  <thead>
    <tr>
      <th>Naam</th><th>Type</th><th>Actief</th><th>Artikelen</th><th>Laatste succes</th><th></th>
    </tr>
  </thead>
  <tbody>
    {% for source in sources %}
      {% include "admin/partials/source_row.html" %}
    {% endfor %}
  </tbody>
</table>
{% endblock %}
